<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Cloud Application</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eaf4ff;
            text-align: center;
        }

        header {
            background: #0078d4;
            color: white;
            padding: 25px;
        }

        .container {
            background: white;
            width: 70%;
            max-width: 600px;
            margin: 70px auto;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 4px 15px #aaa;
        }

        h2 {
            color: #0078d4;
        }

        footer {
            color: #555;
            margin-top: 40px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Cloud-Based Web Application</h1>
    </header>

    <div class="container">
        <h2>Welcome!</h2>

        <p>
            This is my simple cloud-based web application.
        </p>

        <p>
            The application is deployed using GitHub Pages.
        </p>

        <p>
            It demonstrates cloud accessibility,
            scalability and basic security.
        </p>
    </div>

    <footer>
        <p>Mini Project - Experiment 10</p>
    </footer>

</body>
</html>
